stages:
  - lint
  - test
  - coverage

variables:
  CARGO_BUILD_JOBS: "4"
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

.rust-cache: &rust-cache
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - target

fmt-check:
  stage: lint
  image: rust:1-bookworm
  <<: *rust-cache
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all -- --check

clippy:
  stage: lint
  image: rust:1-bookworm
  <<: *rust-cache
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

frontend-typecheck:
  stage: lint
  image: node:22-bookworm
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules
  script:
    - cd frontend
    - npm install
    - npm run typecheck

test:
  stage: test
  image: rust:1-bookworm
  <<: *rust-cache
  services:
    - postgres:15
  variables:
    POSTGRES_USER: user
    POSTGRES_PASSWORD: password
    POSTGRES_DB: byteburrow_test
    DATABASE_URL: postgres://user:password@postgres:5432/byteburrow_test
  script:
    - make test-unit
    - make test-integration

coverage:
  stage: coverage
  image: rust:1-bookworm
  <<: *rust-cache
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked
  script:
    - cargo llvm-cov --workspace --lib --bins --html --output-dir coverage
    - cargo llvm-cov --workspace --lib --bins --summary-only > coverage-summary.txt
    - cat coverage-summary.txt
    - echo "Lines coverage $(awk '/^TOTAL/{print $10}' coverage-summary.txt)"
  coverage: '/^Lines coverage (\d+\.\d+)%$/'
  artifacts:
    paths:
      - coverage/
    expire_in: 90 days
