[workspace]
resolver = "2"
members = ["shared", "web", "plugins/audio", "plugins/video", "plugins/image", "plugins/git"]

[package]
name = "cloud"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
sea-orm = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
shared = { path = "shared" }
sea-orm-migration = { version = "1.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
uuid = { version = "1.1", features = ["v4", "serde"] }

[workspace.package]
version = "0.0.1"
authors = ["Martin Miksanik"]
description = "Cloud system"
documentation = "https://gitlab.com/xmiksay/cloud#"

[workspace.dependencies]
