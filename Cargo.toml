[workspace]
resolver = "2"
members = [".", "byteburrow-plugin-api", "plugins/*"]
exclude = ["plugins/face-embedder/service"]

[package]
name = "byteburrow"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["full"] }
sea-orm = { workspace = true, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tower-http = { workspace = true, features = ["cors", "trace"] }
dotenvy = { workspace = true }
config = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
sea-orm-migration = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
sha2 = { workspace = true }
tower = { workspace = true, features = ["util"] }
axum-extra = { workspace = true, features = ["typed-header"] }
chrono = { workspace = true }
anyhow = "1"
argon2 = "0.5.3"
getrandom = "0.4"
hex = "0.4.3"
minijinja = "2.15.1"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "8.1.0", features = ["axum"] }
kamadak-exif = { workspace = true }
image = { workspace = true }
notify = "8.2.0"
rust-embed = "8"
mime_guess = "2"
libloading = "0.9.0"
byteburrow-plugin-api = { path = "byteburrow-plugin-api" }
libc = "0.2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Martin Miksanik"]
description = "ByteBurrow - Personal cloud system"
documentation = "https://gitlab.com/xmiksay/byteburrow#"

[workspace.dependencies]
axum = { version = "0.7.9" }
tokio = { version = "1.0" }
sea-orm = { version = "1.0" }
serde = { version = "1.0" }
serde_json = "1.0"
clap = { version = "4.0" }
tower-http = { version = "0.5", features = ["fs", "cors"] }
dotenvy = "0.15"
config = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
sea-orm-migration = { version = "1.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
uuid = { version = "1.23.0" }
sha2 = "0.10"
tower = "0.4"
axum-extra = "0.9.6"
chrono = "0.4.44"
image = "0.25"
kamadak-exif = "0.6.1"
